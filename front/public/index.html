<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GymTrack</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; }

      nav { background: #1a1a2e; padding: 16px 24px; }
      nav ul { list-style: none; display: flex; gap: 24px; }
      nav ul li a { color: #fff; text-decoration: none; font-size: 15px; }
      nav ul li a:hover { color: #e94560; }

      .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }

      h1 { margin-bottom: 20px; color: #1a1a2e; }

      form { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 480px; }
      form div { margin-bottom: 16px; }
      form label { display: block; margin-bottom: 6px; font-weight: bold; }
      form input, form select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
      form button { background: #e94560; color: #fff; padding: 10px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
      form button:hover { background: #c73652; }

      .erro { color: red; font-size: 13px; margin-top: 4px; }
      .sucesso { color: green; font-size: 14px; margin-bottom: 12px; }

      table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
      th { background: #1a1a2e; color: #fff; padding: 12px; text-align: left; }
      td { padding: 12px; border-bottom: 1px solid #eee; }
      tr:last-child td { border-bottom: none; }

      .btn-deletar { background: #e94560; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
      .btn-deletar:hover { background: #c73652; }
      .btn-alterar { background: #1a1a2e; color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 4px; }
      .btn-alterar:hover { background: #0f3460; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
